name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: doc-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk DocReader.apk
          gh release delete android-preview --yes --cleanup-tag || true
          gh release create android-preview DocReader.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Doc Reader Android preview" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install on Android: download DocReader.apk, open it, and allow installing from this source when asked."
