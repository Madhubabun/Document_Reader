name: doc_reader
description: "Read, edit and convert PDF, Word, Excel and PowerPoint files on the go."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.3.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  image: ^4.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^2.6.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NOTICE.txt
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/indic/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/indic/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/indic/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/indic/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/indic/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/indic/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/indic/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/indic/NotoSansKannada-Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/indic/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/indic/NotoSansMalayalam-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/indic/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/indic/NotoSansBengali-Bold.ttf
          weight: 700
    - family: Carlito
      fonts:
        - asset: assets/fonts/office/Carlito-normal-400.ttf
        - asset: assets/fonts/office/Carlito-normal-700.ttf
          weight: 700
        - asset: assets/fonts/office/Carlito-italic-400.ttf
          style: italic
        - asset: assets/fonts/office/Carlito-italic-700.ttf
          weight: 700
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
